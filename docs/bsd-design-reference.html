<style>

<body>
<!--
  BSD TYPING Design Reference

  COLOR PALETTE:
  - surface/bg: #11131c
  - surface-container: #1d1f29
  - surface-container-high: #282933
  - surface-container-highest: #32343e
  - primary: #cdbdff (purple)
  - primary-container: #5c1fde
  - secondary: #bdc2ff
  - tertiary/gold: #fabd00
  - on-surface: #e1e1ef
  - on-surface-variant: #cbc3d9
  - outline: #958da2
  - outline-variant: #494456
  - error: #ffb4ab

  DESIGN LANGUAGE:
  - Dark gothic/fantasy theme ("검은 성소 - Black Sanctuary")
  - Glass morphism panels (rgba bg + backdrop-blur)
  - Gold (#fabd00) for highlights, achievements, level
  - Purple (#cdbdff) for primary actions, XP bars
  - Blue-purple (#bdc2ff) for secondary elements
  - Rounded corners (rounded-2xl)
  - Material Symbols Outlined icons
  - Pretendard font family

  HEADER: Fixed top, bg-[#11131c]/80 backdrop-blur-xl, gold "BSD TYPING" logo
    - Left: Logo + Gold amount + Level + EXP
    - Right: Settings icon + Profile avatar

  HOME PAGE SECTIONS:
  1. Hero: Large background image with gradient overlay, "검은 성소의 부름" title with gold-glow,
     subtitle "타자로 마법을 영창하여 어둠의 군단에 맞서십시오", "모험 시작하기" CTA button

  2. Status Dashboard: 3-column grid with glass panels
     - 현재 레벨 (Level) with military_tech icon, gold color
     - 경험치 (EXP) with progress bar, purple color
     - 연속 수련일 (Streak) with calendar icon, blue-purple color

  3. Menu Modes (Bento Grid):
     - 게임 모드 (7/12 cols, large card with bg image, "DUNGEON EXPLORATION")
     - 레슨 모드 (5/12 cols top, "MASTER THE ARTS")
     - 자유 연습 (5/12 cols bottom, "UNRESTRICTED FLOW")

  4. Achievement notification bar at bottom

  MOBILE: Bottom navigation with 4 tabs (퀘스트, 던전, 인벤토리, 업적)
  DESKTOP: Floating left sidebar with icon buttons (Ranking, Mail, Community)
-->
